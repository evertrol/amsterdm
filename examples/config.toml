[channels]
# Frequency of starting channel, in Hertz
fch1 = 1738.0
# Width of a single channel, in Hertz
foff = -4.0
# Anchor point of `fch1`: top, bottom, mid
fanchor = "mid"

[samples]
# Time interval for single sample, in seconds
tsamp = 1e-6
# Start time of first sample, in MJD
tstart = 59881.865628998836


[dm]
# Initial DM
dm0 = 219.4

# Range of DMs for the S/N calculating
# *relative* to `dm0`
# list of 2 floats
dmrange = [-0.2, 0.2]
# number of DMs for `dmrange`
ndm = 50


[selection]
# Fraction of sample range that contains data of interest
# list of 2 floats between 0 and 1
# Alternatively, set to auto to let the algorithm
# find the burst section
data = [0.3333, 0.6666]

# Fractions of sample range that contain background data
# list of list of 2 floats between 0 and 1
# Alternatively, set to auto to let the algorithm
# find the background sections (inverse of the burst section)
background = [[0, 0.3333], [0.6666, 1]]
